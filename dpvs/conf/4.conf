!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
! This is dpvs default configuration file.
!
! The attribute "<init>" denotes the configuration item at initialization stage. Item of
! this type is configured oneshoot and not reloadable. If invalid value configured in the
! file, dpvs would use its default value.
!
! Note that dpvs configuration file supports the following comment type:
!   * line comment: using '#" or '!'
!   * inline range comment: using '<' and '>', put comment in between
!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

! global config
global_defs {
    log_level   WARNING
    ! log_file    /var/log/dpvs.log
    ! log_async_mode    on
    kni                 off
}

! netif config
netif_defs {
    <init> pktpool_size     262244
    <init> pktpool_cache    512

    <init> device eth0 {
        rx {
            queue_number        4
            descriptor_number   1024
            rss                 all
        }
        tx {
            queue_number        4
            descriptor_number   1024
        }
        mtu                   9000
    }

    <init> device eth1 {
        rx {
            queue_number        4
            descriptor_number   1024
            rss                 all
        }
        tx {
            queue_number        4
            descriptor_number   1024
        }
        mtu                   9000
    }

    <init> device eth2 {
        rx {
            queue_number        4
            descriptor_number   1024
            rss                 all
        }
        tx {
            queue_number        4
            descriptor_number   1024
        }
        mtu                   9000
    }

    <init> device eth3 {
        rx {
            queue_number        4
            descriptor_number   1024
            rss                 all
        }
        tx {
            queue_number        4
            descriptor_number   1024
        }
        mtu                   9000
    }
}

! worker config (lcores)
worker_defs {
    <init> worker cpu0 {
        type    master
        cpu_id  0
    }

    <init> worker cpu1 {
        type    slave
        cpu_id  1
        port    eth0 {
            rx_queue_ids     0
            tx_queue_ids     0
        }
        port    eth1 {
            rx_queue_ids     0
            tx_queue_ids     0
        }
        port    eth2 {
            rx_queue_ids     0
            tx_queue_ids     0
        }
        port    eth3 {
            rx_queue_ids     0
            tx_queue_ids     0
        }
    }

    <init> worker cpu2 {
        type    slave
        cpu_id  2
        port    eth0 {
            rx_queue_ids     1
            tx_queue_ids     1
        }
        port    eth1 {
            rx_queue_ids     1
            tx_queue_ids     1
        }
        port    eth2 {
            rx_queue_ids     1
            tx_queue_ids     1
        }
        port    eth3 {
            rx_queue_ids     1
            tx_queue_ids     1
        }
    }

    <init> worker cpu3 {
        type    slave
        cpu_id  3
        port    eth0 {
            rx_queue_ids     2
            tx_queue_ids     2
        }
        port    eth1 {
            rx_queue_ids     2
            tx_queue_ids     2
        }
        port    eth2 {
            rx_queue_ids     2
            tx_queue_ids     2
        }
        port    eth3 {
            rx_queue_ids     2
            tx_queue_ids     2
        }
    }

    <init> worker cpu4 {
        type    slave
        cpu_id  4
        port    eth0 {
            rx_queue_ids     3
            tx_queue_ids     3
        }
        port    eth1 {
            rx_queue_ids     3
            tx_queue_ids     3
        }
        port    eth2 {
            rx_queue_ids     3
            tx_queue_ids     3
        }
        port    eth3 {
            rx_queue_ids     3
            tx_queue_ids     3
        }
    }
}

! timer config
timer_defs {
    # cpu job loops to schedule dpdk timer management
    schedule_interval    500
}

! dpvs neighbor config
neigh_defs {
    <init> unres_queue_length  128
    timeout                    60
}

! dpvs ipset config
ipset_defs {
    <init> ipset_hash_pool_size 131072
}

! dpvs ipv4 config
ipv4_defs {
    forwarding                 off
    <init> default_ttl         64
    fragment {
        <init> bucket_number   4096
        <init> bucket_entries  16
        <init> max_entries     4096
        <init> ttl             1
    }
}


! control plane config
ctrl_defs {
    lcore_msg {
        <init> ring_size                4096
        sync_msg_timeout_us             20000
        priority_level                  low
    }
}

! ipvs config
ipvs_defs {
    conn {
        <init> conn_pool_size       2097152
        <init> conn_pool_cache      256
        conn_init_timeout           3
        ! expire_quiescent_template
        ! fast_xmit_close
        ! <init> redirect           off
    }

    udp {
        ! defence_udp_drop
        uoa_mode        opp
        uoa_max_trail   3
        timeout {
            oneway      60
            normal      300
            last        3
        }
    }

    tcp {
        ! defence_tcp_drop
        timeout {
            none        2
            established 90
            syn_sent    3
            syn_recv    30
            fin_wait    7
            time_wait   7
            close       3
            close_wait  7
            last_ack    7
            listen      120
            synack      30
            last        2
        }
        synproxy {
            synack_options {
                mss             1452
                ttl             63
                sack
                ! wscale        0
                ! timestamp
            }
            close_client_window
            ! defer_rs_syn
            rs_syn_max_retry    3
            ack_storm_thresh    10
            max_ack_saved       3
            conn_reuse_state {
                close
                time_wait
                ! fin_wait
                ! close_wait
                ! last_ack
           }
        }
    }
}

! sa_pool config
sa_pool {
    pool_hash_size  16
    flow_enable     on
}
