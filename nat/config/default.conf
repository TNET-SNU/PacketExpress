############### MOS configuration file ###############

#######################
# MOS-RELATED OPTIONS #
#######################
mos {
	forward = 1

	#######################
	##### I/O OPTIONS #####
	#######################
	# number of memory channels per socket [mandatory for DPDK]
	nb_mem_channels = 8

	# devices used for MOS applications [mandatory]
	netdev {
		# use 1 core
		eth2 0x0001
		eth3 0x0001
		eth4 0x0001
		eth5 0x0001
		eth6 0x0001
		eth7 0x0001
		eth8 0x0001
		eth9 0x0001

		# use 2 cores
		# eth2 0x0003
		# eth3 0x0003
		# eth4 0x0003
		# eth5 0x0003
		# eth6 0x0003
		# eth7 0x0003
		# eth8 0x0003
		# eth9 0x0003

		# use 4 cores
		# eth2 0x000f
		# eth3 0x000f
		# eth4 0x000f
		# eth5 0x000f
		# eth6 0x000f
		# eth7 0x000f
		# eth8 0x000f
		# eth9 0x000f

		# use 8 cores
		# eth2 0x0001
		# eth3 0x0002
		# eth4 0x0004
		# eth5 0x0008
		# eth6 0x0010
		# eth7 0x0020
		# eth8 0x0040
		# eth9 0x0080

		# use 8 cores
		# eth2 0x00ff
		# eth3 0x00ff
		# eth4 0x00ff
		# eth5 0x00ff
		# eth6 0x00ff
		# eth7 0x00ff
		# eth8 0x00ff
		# eth9 0x00ff

		# use 12 core
		# eth2 0x0fff
		# eth3 0x0fff
		# eth4 0x0fff
		# eth5 0x0fff
		# eth6 0x0fff
		# eth7 0x0fff
		# eth8 0x0fff
		# eth9 0x0fff

		# use 13 core
		# eth2 0x1fff
		# eth3 0x1fff
		# eth4 0x1fff
		# eth5 0x1fff
		# eth6 0x1fff
		# eth7 0x1fff
		# eth8 0x1fff
		# eth9 0x1fff

		# use 14 core
		# eth2 0x3fff
		# eth3 0x3fff
		# eth4 0x3fff
		# eth5 0x3fff
		# eth6 0x3fff
		# eth7 0x3fff
		# eth8 0x3fff
		# eth9 0x3fff

		# use 15 core
		# eth2 0x7fff
		# eth3 0x7fff
		# eth4 0x7fff
		# eth5 0x7fff
		# eth6 0x7fff
		# eth7 0x7fff
		# eth8 0x7fff
		# eth9 0x7fff

		# use 16 core
		# eth2 0x0003
		# eth3 0x000c
		# eth4 0x0030
		# eth5 0x00c0
		# eth6 0x0300
		# eth7 0x0c00
		# eth8 0x3000
		# eth9 0xc000
        
		# use 16 core
		# eth2 0xffff
		# eth3 0xffff
		# eth4 0xffff
		# eth5 0xffff
		# eth6 0xffff
		# eth7 0xffff
		# eth8 0xffff
		# eth9 0xffff
	}

	#######################
	### LOGGING OPTIONS ###
	#######################
	# NICs to print network statistics per second
	# if enabled, mTCP will print xx Gbps and xx pps for RX and TX
	stat_print = eth2 eth3 eth4 eth5 eth6 eth7 eth8 eth9
	
	# A directory contains MOS system log files
	# mos_log = logs/

	########################
	## NETWORK PARAMETERS ##
	########################
	# This to configure static arp table
	# (Destination IP address)/(Prefix) (Destination MAC address)
	arp_table {
		10.1.90.2/32 b8:ce:f6:d2:ce:16 # core2
		10.1.95.2/32 b8:ce:f6:d2:ca:4a # core3
		10.2.90.2/32 0c:42:a1:ca:e8:6c # box1
		10.2.95.2/32 f2:9f:7e:d6:cb:be # box3
		10.3.90.2/32 98:03:9b:1e:dc:8c # box2
		10.3.95.2/32 b8:ce:f6:d2:ca:46 # box4
		10.4.90.2/32 e8:eb:d3:a7:32:f2 # protein1
		10.4.95.2/32 98:03:9b:7f:c4:90 # forest1

		# 0.0.0.0/0 b8:ce:f6:d2:ca:46 # NAT machine for WAN (box2)
		# 0.0.0.0/0 08:c0:eb:62:45:04 # NAT machine for WAN (box4)
		# 0.0.0.0/0 98:03:9b:7f:c4:9c # NAT machine for WAN (wood2)
		0.0.0.0/0 10:70:fd:61:7d:e8 # NAT machine for WAN (giant1) it shows best performance for NAT

		# below are just for reference
		
		# my mac1 0c:42:a1:ca:e8:6c
		# my mac2 0c:42:a1:ca:e8:6d

		# nic mac1 0c:42:a1:ca:e8:70
		# nic mac2 0c:42:a1:ca:e8:71
	}

	# This is to configure static routing table
	# (Destination address)/(Prefix) (Device name)
	route_table {
		10.1.90.0/24 eth2
		10.1.95.0/24 eth3
		10.2.90.0/24 eth4
		10.2.95.0/24 eth5
		10.3.90.0/24 eth6
		10.3.95.0/24 eth7
		10.4.90.0/24 eth8
		10.4.95.0/24 eth9
	}


	# This is to configure static bump-in-the-wire NIC forwarding table
	# DEVNIC_A DEVNIC_B ## (e.g. dpdk0 dpdk1) 
	nic_forward_table {
		# eth2 eth2
		# eth3 eth3
		# eth4 eth4
		# eth5 eth5
		# eth6 eth6
		# eth7 eth7
		# eth8 eth8
		# eth9 eth9
	}

	########################
	### ADVANCED OPTIONS ###
	########################
	# if required, uncomment the following options and change them

	# maximum concurrency per core [optional / default : 100000]
	# (MOS-specific parameter for preallocation)
	max_concurrency = 10000

	# disable the ring buffer [optional / default : 0]
	# use disabled buffered managment only for standalone monitors.
	# end host applications always need recv buffers for TCP!
	no_ring_buffers = 1

	# receive buffer size of sockets [optional / default : 1048576 (1M)]
	# 6M, this is the maximum size of recv buffer size at endpoints
	# rmem_size = 6291456
	# rmem_size = 1048576

	# for mmTLS, we removed send ring buffer, so this parameter is not used
	# send buffer size of sockets [optional / default : 1048576 (1M)]
	# wmem_size = 1048576

	# tcp timewait seconds [optional / default : 0]
	# tcp_tw_interval = 0

	# tcp timeout seconds [optional / default : 30]
	# (set tcp_timeout = -1 to disable timeout checking)
	# tcp_timeout = -1
}
